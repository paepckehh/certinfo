<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 531" width="1000" height="531" role="img" aria-label="certinfo - ssh public key">
  <title>certinfo - ssh public key</title>
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#091120"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#122037"/>
      <stop offset="1" stop-color="#0f1b2e"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1000" height="531" rx="16" fill="url(#term)" stroke="#22344f"/>
  <path d="M0 16 A16 16 0 0 1 16 0 H984 A16 16 0 0 1 1000 16 V44 H0 Z" fill="url(#bar)"/>
  <line x1="0" y1="44.5" x2="1000" y2="44.5" stroke="#1e2e47"/>
  <circle cx="24" cy="22" r="6" fill="#f87171"/>
  <circle cx="44" cy="22" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="22" r="6" fill="#34d399"/>
  <text x="500" y="27" class="mono" font-size="12" text-anchor="middle" fill="#7488a3">certinfo - ssh public key</text>
  <text x="32" y="72" class="mono" font-size="14" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">certinfo ~/.ssh/id_ed25519.pub</tspan></text>
  <line x1="0" y1="86" x2="1000" y2="86" stroke="#1b2a41"/>
  <g class="mono" font-size="14">
    <text x="32" y="110"><tspan fill="#67e8f9" font-weight="600">SSH Certificate</tspan></text>
    <text x="32" y="131"><tspan fill="#7d8fa8">SSH Options                 :</tspan></text>
    <text x="32" y="152"><tspan fill="#7d8fa8">SSH Other                   :</tspan></text>
    <text x="32" y="173"><tspan fill="#7d8fa8">SSH Comment                 : </tspan><tspan fill="#c9d6e8">demo@certinfo</tspan></text>
    <text x="32" y="194"><tspan fill="#7d8fa8">SSH Key Sig Algo            : </tspan><tspan fill="#5eead4">ed25519</tspan></text>
    <text x="32" y="215"><tspan fill="#7d8fa8">SSH Key Finger Print        : </tspan><tspan fill="#67e8f9">SHA256:/SxRs7TdzLdACXAnynb8JDFGWJ6VRqsG+Lhd/lidFYs</tspan></text>
    <text x="32" y="236"><tspan fill="#7d8fa8">SSH Key Ascii Art DBAA</tspan></text>
    <text x="32" y="257"><tspan fill="#5eead4">+-----------------+</tspan></text>
    <text x="32" y="278"><tspan fill="#5eead4">|         .=X.+.  |</tspan></text>
    <text x="32" y="299"><tspan fill="#5eead4">|        o.* Ooo  |</tspan></text>
    <text x="32" y="320"><tspan fill="#5eead4">|       . = *== . |</tspan></text>
    <text x="32" y="341"><tspan fill="#5eead4">|        +.oo*=.+o|</tspan></text>
    <text x="32" y="362"><tspan fill="#5eead4">|       .S.o+oE..*|</tspan></text>
    <text x="32" y="383"><tspan fill="#5eead4">|        o ++  o =|</tspan></text>
    <text x="32" y="404"><tspan fill="#5eead4">|       . ...o. + |</tspan></text>
    <text x="32" y="425"><tspan fill="#5eead4">|           .+    |</tspan></text>
    <text x="32" y="446"><tspan fill="#5eead4">|           . .   |</tspan></text>
    <text x="32" y="467"><tspan fill="#5eead4">+-----------------+</tspan></text>
  </g>
</svg>
