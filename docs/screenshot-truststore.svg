  <circle cx="64" cy="22" r="6" fill="#34d399"/>
  <text x="500" y="27" class="mono" font-size="12" text-anchor="middle" fill="#7488a3">certinfo - system trust store</text>
  <text x="32" y="72" class="mono" font-size="14" xml:space="preserve"><tspan fill="#34d399">$ </tspan><tspan fill="#e2e8f0">cat /etc/ssl/certs/ca-certificates.crt | certinfo</tspan></text>
  <line x1="0" y1="86" x2="1000" y2="86" stroke="#1b2a41"/>
  <g class="mono" font-size="14">
    <text x="32" y="110"><tspan fill="#7d8fa8">X509 Cert Subject           : </tspan><tspan fill="#c9d6e8">[CN=DigiCert Global Root G2,OU=www.digicert.com,O=DigiCert Inc,C=US]</tspan></text>
    <text x="32" y="131"><tspan fill="#7d8fa8">X509 Cert Status            : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [for the next 4103 days]</tspan></text>
    <text x="32" y="152"><tspan fill="#7d8fa8">X509 Cert Signature Algo    : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [SHA256-RSA]</tspan></text>
    <text x="32" y="173"><tspan fill="#7d8fa8">X509 Cert Public Key        : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [RSA] [2048] [e:65537]</tspan></text>
    <text x="32" y="194"><tspan fill="#7d8fa8">X509 Cert KeyPin [base64]   :</tspan><tspan fill="#67e8f9"> [i7WTqTvh0OioIruIfFR4kMPnBqrS2rdiVPl/s2uC/CY=]</tspan></text>
    <text x="32" y="215"><tspan fill="#7d8fa8">X509 Cert Key Usage         : </tspan><tspan fill="#fbbf24" font-weight="600">[CRITICAL]</tspan><tspan fill="#c9d6e8"> [Digital Signature] [Certificate Signing] [CRL Signing]</tspan></text>
    <text x="32" y="236"><tspan fill="#7d8fa8">X509 CA Authority           : </tspan><tspan fill="#fbbf24" font-weight="600">[YES]</tspan></text>
    <text x="32" y="257"><tspan fill="#7d8fa8">X509 CA SelfSigned          : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#34d399" font-weight="600">[RootCA]</tspan></text>
    <text x="32" y="278"><tspan fill="#7d8fa8">X509 CA Allows SubCAs       : </tspan><tspan fill="#fbbf24" font-weight="600">[YES]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#fbbf24" font-weight="600">[ALERT]</tspan><tspan fill="#c9d6e8"> [PathLen:NotDefined]</tspan></text>
    <text x="32" y="299"><tspan fill="#7d8fa8">X509 Issuer Signature By    : </tspan><tspan fill="#c9d6e8">[CN=DigiCert Global Root G2,OU=www.digicert.com,O=DigiCert Inc,C=US]</tspan></text>
    <text x="32" y="320"><tspan fill="#7d8fa8">X509 Issuer Signature State : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#34d399" font-weight="600">[trusted via system trust store]</tspan></text>
    <text x="32" y="341"><tspan fill="#7d8fa8">X509 Cert Subject           : </tspan><tspan fill="#c9d6e8">[CN=ISRG Root X1,O=Internet Security Research Group,C=US]</tspan></text>
    <text x="32" y="362"><tspan fill="#7d8fa8">X509 Cert Status            : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [for the next 3147 days]</tspan></text>
    <text x="32" y="383"><tspan fill="#7d8fa8">X509 Cert Signature Algo    : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [SHA256-RSA]</tspan></text>
    <text x="32" y="404"><tspan fill="#7d8fa8">X509 Cert Public Key        : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> [RSA] [4096] [e:65537]</tspan></text>
    <text x="32" y="425"><tspan fill="#7d8fa8">X509 Cert KeyPin [base64]   :</tspan><tspan fill="#67e8f9"> [C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=]</tspan></text>
    <text x="32" y="446"><tspan fill="#7d8fa8">X509 Cert Key Usage         : </tspan><tspan fill="#fbbf24" font-weight="600">[CRITICAL]</tspan><tspan fill="#c9d6e8"> [Certificate Signing] [CRL Signing]</tspan></text>
    <text x="32" y="467"><tspan fill="#7d8fa8">X509 CA Authority           : </tspan><tspan fill="#fbbf24" font-weight="600">[YES]</tspan></text>
    <text x="32" y="488"><tspan fill="#7d8fa8">X509 CA SelfSigned          : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#34d399" font-weight="600">[RootCA]</tspan></text>
    <text x="32" y="509"><tspan fill="#7d8fa8">X509 CA Allows SubCAs       : </tspan><tspan fill="#fbbf24" font-weight="600">[YES]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#fbbf24" font-weight="600">[ALERT]</tspan><tspan fill="#c9d6e8"> [PathLen:NotDefined]</tspan></text>
    <text x="32" y="530"><tspan fill="#7d8fa8">X509 Issuer Signature By    : </tspan><tspan fill="#c9d6e8">[CN=ISRG Root X1,O=Internet Security Research Group,C=US]</tspan></text>
    <text x="32" y="551"><tspan fill="#7d8fa8">X509 Issuer Signature State : </tspan><tspan fill="#34d399" font-weight="600">[VALID]</tspan><tspan fill="#c9d6e8"> </tspan><tspan fill="#34d399" font-weight="600">[trusted via system trust store]</tspan></text>
  </g>
