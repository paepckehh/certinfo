<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="certinfo dashboard: one tool, every certificate, zero flags">
  <title>certinfo - one tool, every certificate, zero flags</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#edf4fd"/>
      <stop offset="1" stop-color="#e5eefb"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.18" r="0.72">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7f9cc0" flood-opacity="0.30"/>
    </filter>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glowA)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#bfd4ec"/>
  <rect x="56" y="0" width="420" height="2" fill="url(#edge)"/>

  <g>
    <path d="M88 56 L120 68 V94 C120 114 105 126 88 132 C71 126 56 114 56 94 V68 Z" fill="url(#mark)"/>
    <rect x="77" y="86" width="22" height="17" rx="4" fill="#ffffff"/>
    <path d="M82 86 V81 A6 6 0 0 1 94 81 V86" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="94" r="2.4" fill="#0d9488"/>
  </g>

  <text x="140" y="101" class="sans" font-size="50" font-weight="700" letter-spacing="-1.2" fill="#0f172a">certinfo</text>
  <text x="142" y="138" class="sans" font-size="18" fill="#4a5b73">One tool. Every certificate. Zero flags.</text>

  <g class="mono" font-size="13">
    <rect x="140" y="160" width="64" height="28" rx="14" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.45"/>
    <text x="172" y="179" text-anchor="middle" fill="#0e7490">x.509</text>
    <rect x="212" y="160" width="56" height="28" rx="14" fill="#ffffff" stroke="#0d9488" stroke-opacity="0.45"/>
    <text x="240" y="179" text-anchor="middle" fill="#0f766e">CSR</text>
    <rect x="276" y="160" width="58" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-opacity="0.40"/>
    <text x="305" y="179" text-anchor="middle" fill="#1d4ed8">SSH</text>
    <rect x="342" y="160" width="58" height="28" rx="14" fill="#ffffff" stroke="#d97706" stroke-opacity="0.40"/>
    <text x="371" y="179" text-anchor="middle" fill="#b45309">PEM</text>
  </g>

  <text x="140" y="238" class="mono" font-size="14" fill="#5b6b82">mixed ASCII in  -&gt;  parallel decode out</text>
  <text x="140" y="264" class="mono" font-size="14" fill="#74849a">grep-stable, deterministic, offline</text>

  <g filter="url(#soft)">
    <rect x="600" y="44" width="552" height="252" rx="16" fill="url(#card)" stroke="#d7e3f2"/>
    <rect x="600" y="44" width="552" height="252" rx="16" fill="none" stroke="#0891b2" stroke-opacity="0.10"/>
    <circle cx="628" cy="70" r="5" fill="#f87171"/>
    <circle cx="648" cy="70" r="5" fill="#fbbf24"/>
    <circle cx="668" cy="70" r="5" fill="#34d399"/>
    <text x="1150" y="74" class="mono" font-size="12" text-anchor="end" fill="#64748b">certinfo report -- ansi</text>
    <line x1="600" y1="88" x2="1152" y2="88" stroke="#e2e8f0"/>
  </g>

  <g class="mono" font-size="14">
    <text x="628" y="118" fill="#64748b">X509 Subject</text>
    <text x="804" y="118" fill="#1d4ed8">[CN=example.com, O=ACME]</text>

    <text x="628" y="148" fill="#64748b">X509 Status</text>
    <text x="804" y="148" fill="#047857">[VALID]</text>
    <text x="884" y="148" fill="#0f766e">[89 days left]</text>

    <text x="628" y="178" fill="#64748b">Signature</text>
    <text x="804" y="178" fill="#047857">[VALID]</text>
    <text x="884" y="178" fill="#0f766e">[Ed25519]</text>

    <text x="628" y="208" fill="#64748b">KeyPin</text>
    <text x="804" y="208" fill="#0e7490">[C5+lpZ7tcVwmwQIMcRt...]</text>

    <text x="628" y="238" fill="#64748b">CA / SelfSigned</text>
    <text x="804" y="238" fill="#b45309">[YES]</text>
    <text x="884" y="238" fill="#92400e">[ROOT]</text>

    <text x="628" y="268" fill="#64748b">SSH Ed25519</text>
    <text x="804" y="268" fill="#047857">[VALID]</text>
    <text x="884" y="268" fill="#0f766e">[keypin aB3...]</text>
  </g>
</svg>
